name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime:
          - { node: 22, pi: "0.84.3" }
          - { node: 24, pi: "0.85.0" }
    runs-on: ${{ matrix.os }}
    steps:
      # v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: npm
          node-version: ${{ matrix.runtime.node }}
      - run: npm ci
      # Pi 0.85.0's standalone SDK entrypoint imports its experimental server.
      - if: matrix.runtime.pi != '0.84.3'
        run: npm install --no-save --package-lock=false @earendil-works/pi-ai@${{ matrix.runtime.pi }} @earendil-works/pi-coding-agent@${{ matrix.runtime.pi }} @earendil-works/pi-tui@${{ matrix.runtime.pi }} @earendil-works/pi-server@${{ matrix.runtime.pi }}
      - run: npm run check
