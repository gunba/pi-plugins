name: CI

on:
  push:
    branches: [main, ci/warm-fast-pipeline]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        task: [checks, 1, 2, 3, 4, 5, 6]
        exclude: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"ubuntu-latest","task":3},{"os":"ubuntu-latest","task":4},{"os":"ubuntu-latest","task":5},{"os":"ubuntu-latest","task":6}]' || '[{"os":"ubuntu-latest","node":24},{"os":"windows-latest","node":22},{"os":"ubuntu-latest","task":3},{"os":"ubuntu-latest","task":4},{"os":"ubuntu-latest","task":5},{"os":"ubuntu-latest","task":6}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Fingerprint exact installed dependencies
        id: dependency-key
        shell: bash
        run: node .github/ci/dependencies.mjs outputs
      # v5
      - name: Restore installed dependencies
        id: dependencies
        if: steps.dependency-key.outputs.cacheable == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.dependency-key.outputs.paths }}
          key: ${{ steps.dependency-key.outputs.key }}
      - name: Locate npm download cache
        if: matrix.task == 'checks' || steps.dependencies.outputs.cache-hit != 'true'
        id: npm-cache
        shell: bash
        run: echo "path=$(node .github/ci/dependencies.mjs npm-cache)" >> "$GITHUB_OUTPUT"
      # Keep release builds' existing npm cache warm without adding it to test shards' critical path.
      - name: Restore npm downloads
        if: matrix.task == 'checks' || steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json', 'pi-desk/package-lock.json') }}
          restore-keys: node-cache-${{ runner.os }}-x64-npm-
      - name: Ensure Linux keyring runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! ldconfig -p | grep -F libsecret-1.so.0 >/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-1-0
          fi
      - name: Install locked dependencies on a cache miss
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: node .github/ci/dependencies.mjs install
      - name: Restore and verify installed dependencies
        if: steps.dependencies.outputs.cache-hit == 'true'
        run: node .github/ci/dependencies.mjs restore
      - name: Prepare pristine installed-dependency cache
        if: steps.dependency-key.outputs.cacheable == 'true' && steps.dependencies.outputs.cache-hit != 'true'
        run: node .github/ci/dependencies.mjs prepare-cache
      - name: Save pristine installed dependencies
        if: steps.dependency-key.outputs.cacheable == 'true' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.dependency-key.outputs.paths }}
          key: ${{ steps.dependency-key.outputs.key }}
      - name: Record Windows scratch filesystems
        if: runner.os == 'Windows' && matrix.task == 'checks'
        shell: pwsh
        run: |
          Write-Output "Default TEMP=$env:TEMP; runner scratch=$env:RUNNER_TEMP"
          [System.IO.DriveInfo]::GetDrives() | Where-Object { $_.IsReady } | Select-Object Name, DriveFormat, DriveType, AvailableFreeSpace | Format-Table
      - name: Typechecks, build and performance contract
        if: matrix.task == 'checks'
        env:
          TEMP: ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}
          TMP: ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}
        run: node .github/ci/quality.mjs
      - name: Run every test in this duration-balanced shard
        if: matrix.task != 'checks'
        env:
          TEMP: ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}
          TMP: ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}
        run: node .github/ci/run-tests.mjs ${{ matrix.task }}/${{ runner.os == 'Windows' && 6 || 2 }}
