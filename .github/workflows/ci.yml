name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        # Native Windows subprocess fixtures need spare CPU; use more VMs, not more workers.
        shard: [1, 2, 3]
        exclude: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"ubuntu-latest","shard":2},{"os":"ubuntu-latest","shard":3}]' || '[{"os":"ubuntu-latest","node":24},{"os":"windows-latest","node":22},{"os":"ubuntu-latest","shard":2},{"os":"ubuntu-latest","shard":3}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pi-desk/package-lock.json
          node-version: ${{ matrix.node }}
      - name: Install Linux keyring runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-1-0
      - run: npm ci
      - run: npm --prefix pi-desk ci --ignore-scripts
      - run: npm --prefix pi-desk rebuild keytar
      - if: matrix.shard == 1
        run: npm run typecheck
      # Stream failure details even if a process fixture leaves a worker alive.
      - run: node --test --test-concurrency=${{ runner.os == 'Windows' && 2 || 4 }} --test-shard=${{ matrix.shard }}/${{ runner.os == 'Windows' && 3 || 1 }} --test-reporter=tap --test-timeout=120000
      - if: matrix.shard == 1
        run: npm --prefix pi-desk run typecheck
      - if: matrix.shard == 1
        run: npm --prefix pi-desk run build
      # Wire bytes, bundle size and search-store work against pi-desk/bench/baseline.json.
      - if: runner.os == 'Linux'
        run: npm --prefix pi-desk run bench -- --check
