name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pi-desk/package-lock.json
          node-version: ${{ matrix.node }}
      - name: Install Linux keyring runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-1-0
      - run: npm ci
      - run: npm --prefix pi-desk ci --ignore-scripts
      - run: npm --prefix pi-desk rebuild keytar
      - run: npm run typecheck
      # Stream failure details even if a process fixture leaves a worker alive.
      - run: npm test -- --test-reporter=tap --test-timeout=120000
      - run: npm --prefix pi-desk run typecheck
      - run: npm --prefix pi-desk run build
